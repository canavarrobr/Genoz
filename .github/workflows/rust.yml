name: Núcleo Rust

on:
  push:
    paths: ["rust/**", "app/rust/Cargo.lock", "test_fixtures/**", ".github/workflows/rust.yml"]
  pull_request:
    paths: ["rust/**", "app/rust/Cargo.lock", "test_fixtures/**", ".github/workflows/rust.yml"]
  # Alertas novos do RustSec aparecem sem mudança no código: confere toda segunda-feira.
  schedule:
    - cron: "0 9 * * 1"

jobs:
  test:
    name: testes (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo fmt --all --check
        if: matrix.os == 'ubuntu-latest'
      - run: cargo clippy --workspace --all-targets -- -D warnings
        if: matrix.os == 'ubuntu-latest'
      - run: cargo test --workspace

  wasm:
    name: compila para WebAssembly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo build -p genoz_core --target wasm32-unknown-unknown --release
        working-directory: rust

  auditoria:
    name: auditoria de dependências (RustSec)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Núcleo e CLI
        run: cargo audit --deny warnings
        working-directory: rust
      - name: Ponte do app
        run: cargo audit --deny warnings
        working-directory: app/rust

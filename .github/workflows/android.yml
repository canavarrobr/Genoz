name: APK Android e iOS

# A cada push: compila o APK (artefato do workflow) e confere que ele não pede
# a permissão INTERNET; compila o iOS sem assinatura.
# Numa tag v* (ex.: v0.7.0): anexa os APKs a um release do GitHub (ação pública —
# só criar a tag com a confirmação do usuário).
#
# Assinatura: se os secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
# ANDROID_KEY_ALIAS e ANDROID_KEY_PASSWORD existirem, o APK sai assinado com a
# chave do Genoz; senão, com a chave de depuração (prévia).

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["app/**", "rust/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/rust
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get

      - name: Chave de assinatura (se configurada)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::notice::Sem secrets de assinatura: APK assinado com a chave de depuração (prévia)."
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/genoz.jks"
          cat > android/key.properties <<EOF
          storeFile=$RUNNER_TEMP/genoz.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: APK universal + um por arquitetura
        run: |
          flutter build apk --release
          flutter build apk --release --split-per-abi
          mkdir -p dist
          v=$(grep '^version:' pubspec.yaml | sed 's/version: //; s/+.*//')
          cp build/app/outputs/flutter-apk/app-release.apk "dist/genoz-$v.apk"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "dist/genoz-$v-arm64.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          ls -la dist

      - name: Permissões do APK (sem INTERNET, sem armazenamento)
        run: |
          aapt=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt
          $aapt dump permissions dist/genoz-*[0-9].apk | tee perms.txt
          if grep -E "android.permission.(INTERNET|READ_EXTERNAL_STORAGE|WRITE_EXTERNAL_STORAGE|MANAGE_EXTERNAL_STORAGE|READ_MEDIA)" perms.txt; then
            echo "::error::O APK pede uma permissão proibida."; exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: genoz-apk
          path: app/dist/

      - name: Release (só em tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          files: app/dist/*
          body: |
            Prévia do Genoz para Android. Para ensino e pesquisa — não é diagnóstico.
            - `genoz-*-arm64.apk`: a maioria dos celulares atuais (menor).
            - `genoz-*.apk`: universal (qualquer arquitetura).
            O app não pede permissão de internet. Confira os arquivos com `SHA256SUMS.txt`.

  ios:
    name: iOS compila (sem assinatura)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/rust
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign

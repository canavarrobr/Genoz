[package]
name = "genoz_core"
description = "Núcleo bioinformático do Genoz (local-first)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
flate2 = "1"
crc32fast = "1"
sha2 = "0.10"
serde.workspace = true
serde_json.workspace = true
thiserror = "2"
# Cofre .genoz (Módulo 11): sem recursos padrão, para não puxar gerador aleatório (o chamador fornece sal e nonce).
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }

[dev-dependencies]
proptest = "1"

[package]
name = "genoz_bridge"
description = "Ponte Flutter ↔ genoz_core (flutter_rust_bridge). Sem lógica científica própria."
version = "0.3.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
genoz_core = { path = "../../rust/genoz_core" }
serde_json = "1"
sha2 = "0.10"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

name: genoz
description: "Genoz - plataforma genômica local-first para ensino e pesquisa."
publish_to: 'none'

version: 0.3.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  drift: ^2.35.0
  drift_flutter: ^0.3.1
  path_provider: ^2.1.6
  file_picker: ^13.1.0
  path: ^1.9.1
  intl: ^0.20.3
  genoz_bridge:
    path: rust_builder
  flutter_rust_bridge: 2.13.0
  freezed_annotation: ^3.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.0
  build_runner: ^2.16.1
  integration_test:
    sdk: flutter
  freezed: ^4.0.2

flutter:
  uses-material-design: true
  generate: true
